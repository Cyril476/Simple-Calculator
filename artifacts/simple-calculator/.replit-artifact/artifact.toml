kind = "web"
previewPath = "/"
title = "Precision Calculator"
description = "A focused offline calculator for everyday arithmetic, packaged for the web and Android."
version = "1.0.0"
id = "artifacts/simple-calculator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/simple-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simple-calculator", "run", "build" ]
serve = "static"
publicDir = "artifacts/simple-calculator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
